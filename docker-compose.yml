version: '3.8'

services:
  web:
    container_name: webapp
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app
    environment:
      - FLASK_ENV=development
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    driver: bridge
