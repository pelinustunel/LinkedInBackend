version: '3.8'

services:
  web:
    container_name: webapp
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "5000" 
    volumes:
      - ./app:/app
    environment:
      - FLASK_ENV=development
    restart: unless-stopped
    networks:
      - default

  nginx:
    image: nginx:stable
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - default

networks:
  default:
    driver: bridge
